[project]
name = "myagents"
version = "0.0.1"
description = "Research and analysis specialist agent with wide search access and analysis capabilities, todo list capabilities, and mock file system. Built on LangGraph."
readme = "deepagents.README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=0.2.6",
    "langchain>=0.2.14",
    "langchain-openai>=0.2.14",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.8.0",
    "requests>=2.32.3",
    "tavily-python>=0.0.5",
    "pydantic>=2.0.0",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "aiohttp>=3.9.0",
    "langgraph-cli[inmem]>=0.0.19"
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.0"
]
